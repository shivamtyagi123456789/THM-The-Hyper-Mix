[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "true-hyper-mixing"
version = "1.0.0"
description = "Context-aware playback engine that preserves room vibe across 52 perceptual dimensions."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Antigravity Team" }]
dependencies = [
    "flask>=3.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "mutagen>=1.47.0",
    "pyloudnorm>=0.1.1",
    "librosa>=0.10.0",
]
requires-python = ">=3.10"
